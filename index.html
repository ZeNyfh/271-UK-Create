<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>UKGeo Hover Map</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="tools/hoverpreview-tools/site/styles.css?v=20260718-7" />
</head>
<body data-default-manifest="tools/ukgeo-tools/uk_world_data_gb/hoverpreviews/hover_manifest.json">
  <div class="app-shell">
    <header class="controls" aria-label="Map controls">
      <strong class="app-title">UKGeo hover map</strong>
      <span id="load-state" class="load-state">Loading preview data…</span>
      <span class="control-separator" aria-hidden="true"></span>
      <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      <button id="zoom-fit" type="button">Fit</button>
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <input id="zoom-label" class="zoom-label" type="text" value="100%" inputmode="numeric" aria-label="Zoom percentage" />
      <span class="zoom-hint">Shift: 1%</span>
      <span class="control-separator" aria-hidden="true"></span>
      <span class="control-separator" aria-hidden="true"></span>
      <div id="layer-controls" class="control-list" aria-label="Layer toggles"></div>
      <details class="ore-menu">
        <summary>Ores ▾</summary>
        <div id="ore-controls" class="control-list ore-list" aria-label="Ore toggles"></div>
      </details>
      <details class="ore-menu animal-menu">
        <summary>Animals ▾</summary>
        <div id="animal-controls" class="control-list ore-list animal-list" aria-label="Animal filters"></div>
      </details>
      <form id="latlon-form" class="latlon-form" aria-label="Go to longitude and latitude">
        <label>Lon <input id="lon-input" class="coord-input" type="text" inputmode="decimal" autocomplete="off" /></label>
        <label>Lat <input id="lat-input" class="coord-input" type="text" inputmode="decimal" autocomplete="off" /></label>
        <button id="latlon-go" type="submit">Go</button>
      </form>
    </header>

    <main class="map-frame">
      <div id="viewer" class="viewer" tabindex="0" role="application" aria-label="Interactive UKGeo hover preview map">
        <div id="map-stack" class="map-stack"></div>
        <div id="empty-state" class="empty-state" hidden>
          <h1>Map data unavailable</h1>
          <p>The UKGeo map viewer could not be initialised.</p>
          <p data-load-error>Refresh the page to try again.</p>
        </div>
      </div>
    </main>
  </div>

  <output id="status" class="status" aria-live="polite">Mouse wheel zooms. Middle/right drag pans. Left drag measures distance. Left click copies the current Minecraft coordinates.</output>

  <script src="tools/hoverpreview-tools/site/render_math.js?v=20260718-5" defer></script>
  <script src="tools/hoverpreview-tools/site/app.js?v=20260719-1" defer></script>
</body>
</html>
