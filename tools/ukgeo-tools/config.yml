  RIVERS_ZIP: ../../data/oprvrs_gpkg_gb_ie.zip
  LANDCOVER_ZIP: ../../data/FME_3564346A_1778997494261_5633.zip
  ANIMALS_SVG: ../../data/SVGS/Animals British Isles export.svg
  IRON_OVERLAY_IMAGE: ../../data/uk_iron_ore_reference_overlay.svg
  IRON_OVERLAY_SCORE: 180
  IRON_OVERLAY_FIT: outline
  ROI_ORES_SVG: ../../data/SVGS/Ores Republic of Ireland export.svg
  ROI_ORE_OVERLAY_SCORE: 180
  ORE_RULES: examples/ore_rules_625k.yml
  SURFACE_RULES: examples/surface_geology_625k.yml
  WORLD_X_SCALE: 1.0
  WORLD_Z_SCALE: 1.0
  # WORLD_X_SCALE: 1.5
  # WORLD_Z_SCALE: 1.5
  BNG_MIN_EASTING_IRELAND: -220000
  BNG_MIN_NORTHING_IRELAND: 0
  BNG_MAX_EASTING: 650000
  BNG_MAX_NORTHING: 1300000
  WORLD_WIDTH_IRELAND: 33462
  WORLD_WIDTH_GB: 25000
  WORLD_DEPTH: 50000

