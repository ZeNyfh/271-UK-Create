name: Deploy GitHub Pages site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".nojekyll"
      - "tools/hoverpreview-tools/site/**"
      - "data/uk_world_data_gb_hoverpreviews.zip"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true
          sparse-checkout: |
            .nojekyll
            index.html
            tools/hoverpreview-tools/site
            data/uk_world_data_gb_hoverpreviews.zip
            .github/workflows/pages.yml
          sparse-checkout-cone-mode: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage root Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/tools/hoverpreview-tools _site/tools/ukgeo-tools/uk_world_data_gb
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          cp -R tools/hoverpreview-tools/site _site/tools/hoverpreview-tools/site
          if [ -f data/uk_world_data_gb_hoverpreviews.zip ]; then
            unzip -q -o data/uk_world_data_gb_hoverpreviews.zip -d _site/tools/ukgeo-tools/uk_world_data_gb
          else
            echo "::warning::data/uk_world_data_gb_hoverpreviews.zip is missing; the page will load but show the empty state."
            mkdir -p _site/tools/ukgeo-tools/uk_world_data_gb/hoverpreviews
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  report-build-status:
    name: Report build status
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Report build result
        shell: bash
        run: |
          set -euo pipefail
          echo "Build result: ${{ needs.build.result }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::GitHub Pages build failed: ${{ needs.build.result }}"
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build
      - report-build-status
    if: needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
